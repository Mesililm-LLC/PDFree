[workspace]
members = ["crates/viewer-core", "crates/pdf-engine", "crates/pdfree"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Slint generates a large UI module; full debug metadata exhausts memory during
# concurrent test linking on the supported Windows development machine.
[profile.dev.package.pdfree]
debug = 0

[profile.test.package.pdfree]
debug = 0

[profile.dev.package.pdf-engine]
debug = 0
opt-level = 1

[profile.test.package.pdf-engine]
debug = 0
opt-level = 1
